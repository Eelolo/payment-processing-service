[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Async payment processing microservice: FastAPI + PostgreSQL + RabbitMQ (outbox, retries, DLQ)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "faststream[rabbit,cli]==0.7.7",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PL"]
ignore = [
    "S311",    # random is fine for the gateway emulator, it is not cryptography
    "PLR2004", # magic value comparison in tests/http codes
]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR0913"]
"scripts/**" = ["S101"]  # a scenario script: assert is the check itself
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
